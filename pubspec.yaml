name: autopulse_challenge
description: "AutoPulse Intern Challenge - OCR Maintenance Reader"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Image/file picking
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # PDF → image conversion
  pdfx: ^2.6.0

  # HTTP for LLM API call
  http: ^1.2.1

  # Image preprocessing
  image: ^4.2.0

  # File system access
  path_provider: ^2.1.1

  # Runtime permissions
  permission_handler: ^12.0.1

  # OCR for text extraction (English + Arabic)
  google_mlkit_text_recognition: ^0.13.1

  # UI utilities
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  dotted_border: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
